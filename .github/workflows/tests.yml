# Runs the app's unit tests, build and lint on every pull request and every push to main.
# No phone needed.
name: tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6
      # The runner's Android SDK (ANDROID_HOME); no app signing key, so the default debug key signs.
      - run: ./gradlew testDebugUnitTest assembleDebug lintDebug
